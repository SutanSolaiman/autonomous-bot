<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Autonomous Mentor Chat</title>

  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --error-bg: #fee2e2;
      --system-bg: #eff6ff;
      --bot-bg: #ffffff;
      --user-bg: #dbeafe;
      --input-bg: #ffffff;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
      gap: 14px;
    }

    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .student-panel {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .student-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr 150px 130px;
      gap: 10px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .field input,
    .field select,
    .composer textarea {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 10px;
      font-size: 14px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
    }

    .field input,
    .field select {
      height: 40px;
    }

    .field input:focus,
    .field select:focus,
    .composer textarea:focus {
      border-color: var(--primary);
    }

    #studentAuthBtn {
      height: 40px;
      border: 0;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
    }

    #studentAuthBtn:hover {
      background: var(--primary-hover);
    }

    #studentAuthBtn.is-signed-in {
      background: var(--danger);
    }

    #studentAuthBtn.is-signed-in:hover {
      background: var(--danger-hover);
    }

    .student-auth-status {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .student-auth-status.ok {
      color: var(--success);
    }

    .student-auth-status.error {
      color: var(--danger);
    }

    .chat-card {
      flex: 1;
      min-height: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 10px;
      align-items: center;
    }

    .chat-header .field {
      gap: 5px;
    }

    .chat-header input {
      height: 38px;
    }

    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f9fafb;
    }

    .message {
      max-width: 86%;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bg);
    }

    .message.system {
      align-self: center;
      background: var(--system-bg);
      color: #1e3a8a;
      max-width: 95%;
    }

    .message.error {
      align-self: center;
      background: var(--error-bg);
      color: #991b1b;
      max-width: 95%;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 10px;
      background: var(--card);
    }

    .composer textarea {
      width: 100%;
      min-height: 70px;
      resize: vertical;
      padding: 10px;
      line-height: 1.4;
    }

    .composer button {
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
      font-size: 15px;
    }

    .composer button:hover {
      background: var(--primary-hover);
    }

    .composer button:disabled,
    #studentAuthBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 900px) {
      .app {
        padding: 10px;
      }

      .student-grid {
        grid-template-columns: 1fr;
      }

      .chat-header {
        grid-template-columns: 1fr;
      }

      .composer {
        grid-template-columns: 1fr;
      }

      .composer button {
        height: 44px;
      }

      #studentAuthBtn {
        width: 100%;
      }

      .message {
        max-width: 96%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Autonomous Mentor Chat</h1>
        <p>Select Existing Student or New Student, then use the button to continue.</p>
      </div>
    </header>

    <section class="student-panel">
      <div class="student-grid">
        <div class="field">
          <label for="studentId">Student ID</label>
          <input
            id="studentId"
            type="text"
            placeholder="Example: 001"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="studentName">Name</label>
          <input
            id="studentName"
            type="text"
            placeholder="Student name"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="studentEmail">Email</label>
          <input
            id="studentEmail"
            type="email"
            placeholder="student@email.com"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="studentAuthMode">Student Type</label>
          <select id="studentAuthMode">
            <option value="signin">Existing Student</option>
            <option value="signon">New Student</option>
          </select>
        </div>

        <div class="field">
          <label>&nbsp;</label>
          <button id="studentAuthBtn" type="button" onclick="handleStudentAuthButton()">
            Sign In
          </button>
        </div>
      </div>

      <div id="studentAuthStatus" class="student-auth-status"></div>
    </section>

    <main class="chat-card">
      <div class="chat-header">
        <div class="field">
          <label for="activityCode">Activity</label>
          <input id="activityCode" type="text" placeholder="Example: 1.1" />
        </div>

        <div class="field">
          <label>Status</label>
          <input id="chatStatus" type="text" value="Ready" readonly />
        </div>
      </div>

      <div id="messages"></div>

      <div class="composer">
        <textarea
          id="userMessage"
          placeholder="Type the student's answer here..."
        ></textarea>

        <button id="sendBtn" type="button" onclick="sendMessage()">
          Send
        </button>
      </div>
    </main>
  </div>

  <script>
    async function callBackend(payload) {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload || {})
      });

      const text = await res.text();

      try {
        return JSON.parse(text);
      } catch (err) {
        return {
          ok: false,
          error: text || String(err)
        };
      }
    }

    let signedInStudent = null;
    let sessionId = getOrCreateSessionId();

    function getEl(id) {
      return document.getElementById(id);
    }

    function getOrCreateSessionId() {
      const existing = localStorage.getItem("mentorSessionId");

      if (existing) {
        return existing;
      }

      const created =
        "websess_" +
        new Date().toISOString().replace(/[-:.TZ]/g, "") +
        "_" +
        Math.random().toString(36).slice(2, 10);

      localStorage.setItem("mentorSessionId", created);
      return created;
    }

    function setChatStatus(text) {
      const el = getEl("chatStatus");

      if (el) {
        el.value = text || "";
      }
    }

    function addMessage(type, text) {
      const box = getEl("messages");

      if (!box) return;

      const div = document.createElement("div");
      div.className = "message " + (type || "bot");
      div.textContent = String(text || "");

      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function formatError(err) {
      if (!err) return "Unknown error.";
      if (typeof err === "string") return err;
      if (err.message) return err.message;
      return JSON.stringify(err);
    }

    function getStudentFormValues() {
      return {
        studentId: getEl("studentId") ? getEl("studentId").value.trim() : "",
        name: getEl("studentName") ? getEl("studentName").value.trim() : "",
        email: getEl("studentEmail") ? getEl("studentEmail").value.trim() : ""
      };
    }

    function setStudentFormValues(data) {
      data = data || {};

      if (getEl("studentId")) {
        getEl("studentId").value = data.studentId || "";
      }

      if (getEl("studentName")) {
        getEl("studentName").value = data.name || "";
      }

      if (getEl("studentEmail")) {
        getEl("studentEmail").value = data.email || "";
      }
    }

    function clearStudentForm() {
      setStudentFormValues({
        studentId: "",
        name: "",
        email: ""
      });
    }

    function getAuthMode() {
      const modeEl = getEl("studentAuthMode");
      return modeEl ? modeEl.value : "signin";
    }

    function getAuthModeLabel() {
      return getAuthMode() === "signon" ? "Sign On" : "Sign In";
    }

    function setStudentAuthStatus(message, type) {
      const el = getEl("studentAuthStatus");

      if (!el) return;

      el.textContent = message || "";
      el.className = "student-auth-status";

      if (type) {
        el.classList.add(type);
      }
    }

    function setAuthButtonState(isSignedIn) {
      const btn = getEl("studentAuthBtn");
      const modeEl = getEl("studentAuthMode");

      if (!btn) return;

      if (isSignedIn) {
        btn.textContent = "Sign Out";
        btn.dataset.mode = "signout";
        btn.classList.remove("is-signed-out");
        btn.classList.add("is-signed-in");

        if (modeEl) {
          modeEl.disabled = true;
        }

        return;
      }

      btn.textContent = getAuthModeLabel();
      btn.dataset.mode = "auth";
      btn.classList.remove("is-signed-in");
      btn.classList.add("is-signed-out");

      if (modeEl) {
        modeEl.disabled = false;
      }
    }

    function handleStudentAuthModeChange() {
      if (!signedInStudent) {
        setAuthButtonState(false);
        setStudentAuthStatus("", "");
      }
    }

    function handleStudentAuthButton() {
      const btn = getEl("studentAuthBtn");
      const mode = btn && btn.dataset.mode === "signout" ? "signout" : "auth";

      if (mode === "signout") {
        signOutCurrentStudent();
        return;
      }

      signInOrSignOnStudent();
    }

    async function signInOrSignOnStudent() {
      const form = getStudentFormValues();
      const authMode = getAuthMode();

      if (!form.studentId) {
        setStudentAuthStatus("Student ID is required.", "error");
        addMessage("error", "Student ID is required.");
        return;
      }

      if (!form.name) {
        setStudentAuthStatus("Name is required.", "error");
        addMessage("error", "Name is required.");
        return;
      }

      if (!form.email) {
        setStudentAuthStatus("Email is required.", "error");
        addMessage("error", "Email is required.");
        return;
      }

      const btn = getEl("studentAuthBtn");

      if (btn) {
        btn.disabled = true;
      }

      setStudentAuthStatus("Checking student...", "");
      setChatStatus("Signing in...");

      try {
        const result = await callBackend({
          action: "signInStudent",
          studentId: form.studentId,
          name: form.name,
          email: form.email,
          userName: form.name,
          userEmail: form.email,
          userRole: "Student",
          authMode: authMode
        });

        if (!result || result.ok === false) {
          const errorText = result && result.error ? result.error : "Authentication failed.";
          setStudentAuthStatus(errorText, "error");
          addMessage("error", errorText);
          return;
        }

        signedInStudent = {
          studentId: result.studentId || form.studentId,
          name: result.name || form.name,
          email: result.email || form.email,
          level: result.level || "Student"
        };

        localStorage.setItem("signedInStudent", JSON.stringify(signedInStudent));

        setStudentFormValues(signedInStudent);
        setAuthButtonState(true);

        const successText = result.created
          ? "Student registered and signed in."
          : "Student signed in.";

        setStudentAuthStatus(successText, "ok");
        addMessage("system", successText);

      } catch (err) {
        const errorText = "Authentication failed: " + formatError(err);
        setStudentAuthStatus(errorText, "error");
        addMessage("error", errorText);

      } finally {
        if (btn) {
          btn.disabled = false;
        }

        setChatStatus("Ready");
      }
    }

    async function signOutCurrentStudent() {
      const studentId =
        signedInStudent && signedInStudent.studentId
          ? signedInStudent.studentId
          : getStudentFormValues().studentId;

      const btn = getEl("studentAuthBtn");

      if (btn) {
        btn.disabled = true;
      }

      setChatStatus("Signing out...");

      try {
        if (studentId) {
          const result = await callBackend({
            action: "signOutStudent",
            studentId: studentId
          });

          if (!result || result.ok === false) {
            const errorText = result && result.error ? result.error : "Sign out failed.";
            setStudentAuthStatus(errorText, "error");
            addMessage("error", errorText);
            return;
          }
        }

        signedInStudent = null;
        localStorage.removeItem("signedInStudent");

        clearStudentForm();
        setAuthButtonState(false);
        setStudentAuthStatus("Student signed out.", "ok");
        addMessage("system", "Student signed out.");

      } catch (err) {
        const errorText = "Sign out failed: " + formatError(err);
        setStudentAuthStatus(errorText, "error");
        addMessage("error", errorText);

      } finally {
        if (btn) {
          btn.disabled = false;
        }

        setChatStatus("Ready");
      }
    }

    function restoreSignedInStudent() {
      const saved = localStorage.getItem("signedInStudent");

      if (!saved) {
        signedInStudent = null;
        clearStudentForm();
        setAuthButtonState(false);
        setStudentAuthStatus("", "");
        return;
      }

      try {
        signedInStudent = JSON.parse(saved);

        if (!signedInStudent || !signedInStudent.studentId) {
          throw new Error("Invalid saved student.");
        }

        setStudentFormValues(signedInStudent);
        setAuthButtonState(true);
        setStudentAuthStatus("Student signed in.", "ok");

      } catch (err) {
        signedInStudent = null;
        localStorage.removeItem("signedInStudent");
        clearStudentForm();
        setAuthButtonState(false);
        setStudentAuthStatus("", "");
      }
    }

    function getActiveStudentForPayload() {
      const formStudent = getStudentFormValues();

      if (signedInStudent && signedInStudent.studentId) {
        return signedInStudent;
      }

      return {
        studentId: formStudent.studentId,
        name: formStudent.name,
        email: formStudent.email,
        level: "Student"
      };
    }

    function validateBeforeSend(message, activeStudent) {
      if (!activeStudent || !activeStudent.studentId) {
        addMessage("error", "Please sign in or sign on before sending an answer.");
        return false;
      }

      if (!activeStudent.name) {
        addMessage("error", "Name is required before sending an answer.");
        return false;
      }

      if (!activeStudent.email) {
        addMessage("error", "Email is required before sending an answer.");
        return false;
      }

      if (!message) {
        addMessage("error", "Message is empty.");
        return false;
      }

      return true;
    }

    async function sendMessage() {
      const input = getEl("userMessage");
      const sendBtn = getEl("sendBtn");

      const message = input ? input.value.trim() : "";
      const activeStudent = getActiveStudentForPayload();

      if (!validateBeforeSend(message, activeStudent)) {
        return;
      }

      addMessage("user", message);

      if (input) {
        input.value = "";
      }

      if (sendBtn) {
        sendBtn.disabled = true;
      }

      setChatStatus("Evaluating...");

      try {
        const payload = {
          message: message,
          sessionId: sessionId,
          studentId: activeStudent.studentId,
          userName: activeStudent.name,
          userEmail: activeStudent.email,
          userRole: activeStudent.level || "Student",
          chatMode: "mentor",
          activityCode: getEl("activityCode") ? getEl("activityCode").value.trim() : ""
        };

        const result = await callBackend(payload);

        if (!result || result.ok === false) {
          addMessage("error", result && result.error ? result.error : "Backend error.");
          return;
        }

        addMessage("bot", result.answer || JSON.stringify(result, null, 2));

      } catch (err) {
        addMessage("error", "Request failed: " + formatError(err));

      } finally {
        if (sendBtn) {
          sendBtn.disabled = false;
        }

        setChatStatus("Ready");
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const modeEl = getEl("studentAuthMode");

      if (modeEl) {
        modeEl.addEventListener("change", handleStudentAuthModeChange);
      }

      const input = getEl("userMessage");

      if (input) {
        input.addEventListener("keydown", function(e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
      }

      restoreSignedInStudent();

      addMessage(
        "system",
        "Welcome. Select Existing Student or New Student, then use the button to continue."
      );
    });
  </script>
</body>
</html>
